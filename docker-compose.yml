# Base de datos PostgreSQL para desarrollo local: docker compose up -d
services:
  db:
    image: postgres:17
    container_name: fidegresa-db
    environment:
      POSTGRES_DB: fidegresa_db
      POSTGRES_USER: ${DB_USERNAME:-fidegresa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fidegresa_local}
    ports:
      - "5432:5432"
    volumes:
      - fidegresa-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  fidegresa-db-data:
