# Configuración solo para las pruebas (mvn test y GitHub Actions).
# Usa una base de datos H2 en memoria para no depender de PostgreSQL.
spring.datasource.url=jdbc:h2:mem:fidegresa_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=USER,VALUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Correo de prueba: no se envía nada durante los tests.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@fidegresa.local
spring.mail.password=test

app.jwt.secret=clave-solo-para-pruebas-automaticas-0123456789
app.cors.allowed-origins=http://localhost:5173
app.seed.enabled=true
app.seed.password=Prueba2026
app.seed.email=maria@fidegresa.com

# Google Wallet apagado en las pruebas (las de Wallet usan un servidor falso).
app.wallet.issuer-id=
app.wallet.service-account=
app.wallet.retry-delay-ms=10
