# Todas las claves y contraseñas vienen de variables de entorno: nada sensible queda en el repositorio.
# En local, si no defines nada, usa PostgreSQL en localhost con tu usuario del sistema.
spring.application.name=fidegresa-backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fidegresa_db}
spring.datasource.username=${DB_USERNAME:${USER:postgres}}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: en producción define JWT_SECRET (mínimo 32 caracteres). Si falta, se genera una clave temporal al iniciar.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}
app.jwt.refresh-days=${JWT_REFRESH_DAYS:14}

# Orígenes que pueden llamar a la API (separados por comas), por ejemplo la URL de Vercel.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Carga los datos iniciales para la demo solo si la base está vacía.
app.seed.enabled=${SEED_DEMO:true}
app.seed.email=${SEED_EMAIL:maria@fidegresa.com}
# Cuenta pública de demostración (la misma del README); cámbiala con SEED_PASSWORD en producción.
app.seed.password=${SEED_PASSWORD:Fidegresa2026}

# Correo de bienvenida (opcional). Si no se configura, el registro funciona igual y no se envía correo.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Imágenes de las tarjetas (logo y portada) viajan en el cuerpo de la petición.
server.tomcat.max-http-form-post-size=4MB

# Archivos de los catálogos: PDF hasta 20 MB e imágenes hasta 5 MB (el límite fino lo aplica el backend por formato).
# Se guardan en disco temporal mientras llegan, no en memoria.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
spring.servlet.multipart.file-size-threshold=0

# Dónde se guarda el contenido: db (PostgreSQL) o s3 (AWS S3, Cloudflare R2, MinIO).
app.files.storage=${FILE_STORAGE:db}
app.files.s3.endpoint=${S3_ENDPOINT:}
app.files.s3.bucket=${S3_BUCKET:}
app.files.s3.region=${S3_REGION:auto}
app.files.s3.access-key-id=${S3_ACCESS_KEY_ID:}
app.files.s3.secret-access-key=${S3_SECRET_ACCESS_KEY:}

# Menú público del QR (/m/{slug}).
# PUBLIC_WEB_URL: dirección del frontend (ej. https://frontendfidegresa.vercel.app) para armar el enlace completo del QR.
app.public.web-url=${PUBLIC_WEB_URL:}
# Versión del texto de consentimiento que acepta el cliente al unirse (se guarda con cada cliente).
app.public.consent-version=${CONSENT_VERSION:2026-11}
# Cabecera con la IP real del visitante detrás del proxy (en Render: X-Forwarded-For). Vacío = la IP de la conexión.
app.public.client-ip-header=${CLIENT_IP_HEADER:}

# Google Wallet (pases de las tarjetas). Sin estas dos variables, Wallet queda apagado y responde 503.
app.wallet.issuer-id=${GOOGLE_WALLET_ISSUER_ID:}
app.wallet.service-account=${GOOGLE_WALLET_SERVICE_ACCOUNT:}
# Logo del pase: una URL HTTPS pública (Google la descarga). Vacío = el pase sale sin logo.
app.wallet.logo-url=${GOOGLE_WALLET_LOGO_URL:}
